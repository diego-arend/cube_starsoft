metadata:
  author: "Equipe de Engenharia"
  version: "1.3.0"
  last-updated: "2026-01-05"
  example-use-case: "Planejar inclusão de novas configurações no config.yaml e sua validação no packages/config"

model: "Raptor mini (Preview)"

timeouts:
  plan: 120s
  step: 30s

guardrails:
  - run: "pnpm -w -C . run format"
  - run: "pnpm -w -C . run lint"
  - run: "pnpm -w -C . run test:all"
  - require_human_approval: true

steps:
  - id: analyze-packages
    description: "Mapear pacotes relevantes e localizar tipos/DTOs/serviços/componentes/stores."
  - id: verify-functionality
    description: "Verificar se a funcionalidade já existe; propor integração quando aplicável."
  - id: create-plan
    description: "Criar o plano de alteração/criação, incluindo arquivos a serem modificados, novos arquivos, e mudanças específicas. Priorizar reuso de componentes existentes."

notes:
  - "Este arquivo contém parâmetros de runtime para a geração de planos. NÃO inclua modelos sensíveis ou segredos no repositório público."
  - "Nota: A propriedade `model` pode ser ignorada por GitHub.com; ela é aplicada pelo runtime local/IDE. Para controlar o modelo em IDEs, use o `model:` em frontmatter do `.agent.md` quando aplicável."
  - "Frontend: O plano deve priorizar o reuso de componentes de `packages/ui` ou planejar a expansão do mesmo via ShadcnUI."