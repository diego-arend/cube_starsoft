services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: turborepo_saas_postgres_ngrok
    environment:
      POSTGRES_DB: turborepo_crew_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - engecomp_crew_agents_postgres_data_ngrok:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  redis:
    image: redis:7
    container_name: turborepo_saas_redis_ngrok
    ports:
      - "6379:6379"
    volumes:
      - engecomp_crew_agents_redis_data_ngrok:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: turborepo_saas_rabbitmq_ngrok
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692" # Prometheus metrics
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    volumes:
      - engecomp_crew_agents_rabbitmq_data_ngrok:/var/lib/rabbitmq
    entrypoint: >
      /bin/bash -c "
      rabbitmq-plugins enable rabbitmq_prometheus &&
      docker-entrypoint.sh rabbitmq-server
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  # Migration Job — one-shot container managed exclusively by
  # scripts/docker-up-test-load.sh (Phase 2). The script:
  #   1. Starts this service blocking (no -d), waits for exit.
  #   2. Fails fast on non-zero exit code.
  #   3. Immediately removes the container with `docker compose rm -f migration`.
  #   4. Only then starts backend and worker-notification (Phase 3).
  #
  # restart: "no" prevents automatic recreation if the container exits.
  # backend and worker-notification do NOT list migration in their depends_on
  # because the script guarantees migration is fully removed before those
  # services are started. Listing migration here would cause `docker compose up -d`
  # (without the script) to re-run migration whenever the container is absent.
  migration:
    build:
      context: ../..
      dockerfile: docker/test-load/Dockerfile.backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.backend
    environment:
      # The migration job is the only place that explicitly enables migrations.
      # .env.backend has DATABASE_MIGRATIONS_RUN=false (production default).
      DATABASE_MIGRATIONS_RUN: "true"
    entrypoint: ["/entrypoint.sh"]
    command: ["echo", "[migration-job] done"]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "migration"

  # Backend Application
  backend:
    build:
      context: ../..
      dockerfile: docker/test-load/Dockerfile.backend
    restart: unless-stopped
    # Migration is NOT listed here — scripts/docker-up-test-load.sh removes
    # the migration container before starting this service (Phase 3).
    # Listing migration would cause `docker compose up -d backend` to re-run it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "com.turborepo.env=production"
      - "com.turborepo.service=app"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Worker Notification Application
  worker-notification:
    build:
      context: ../..
      dockerfile: docker/test-load/Dockerfile.worker
    restart: unless-stopped
    # Migration is NOT listed here — scripts/docker-up-test-load.sh removes
    # the migration container before starting this service (Phase 3).
    # Listing migration would cause `docker compose up -d worker-notification`
    # to re-run it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.worker
    environment:
      # Disable automatic OTEL SDK metric/log exporters.
      # The NodeSDK auto-creates PeriodicExportingMetricReader when
      # OTEL_METRICS_EXPORTER=otlp is set — this fires every 15s and
      # causes the process to crash when otel-collector is unreachable.
      # Traces still work via the explicit traceExporter in instrumentation.ts.
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "none"
      # Suppress DEP0040: punycode builtin deprecation warning emitted by
      # node-fetch@2 (pulled by gcp-metadata → gaxios, a transitive dep of
      # @opentelemetry/resource-detector-gcp). The warning is harmless —
      # it originates from a third-party package that cannot be patched here.
      NODE_NO_WARNINGS: "1"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "app"

  # Frontend Application
  frontend:
    build:
      context: ../..
      dockerfile: docker/ngrok/Dockerfile.frontend
      # NEXT_PUBLIC_* vars must be known at build time (inlined by webpack).
      # Server-side secrets come from env_file at runtime — never from build args.
      args:
        # Relative path: browser calls hit <ngrok-origin>/api/... which Traefik
        # routes to the Next.js frontend. Next.js then proxies to backend:3001
        # over Docker network (see apps/frontend/next.config.ts rewrites).
        NEXT_PUBLIC_API_URL: "/api"
        # Empty: Socket.IO client uses window.location.origin, so connections go
        # through ngrok -> Traefik -> Next.js -> backend:3001 (same rewrite path).
        NEXT_PUBLIC_SOCKET_URL: ""
        NEXT_PUBLIC_FARO_URL: "http://localhost:12347/collect"
        NEXT_PUBLIC_APP_VERSION: "1.0.0"
        NEXT_PUBLIC_ENV: "production"
        NEXT_PUBLIC_OTEL_ENABLED: "true"
        NEXT_PUBLIC_OTEL_SERVICE_NAME: "frontend-server"
        # Server-side rewrite destination — routes through the internal Traefik
        # backendweb entrypoint (:8082) for health-check-aware LB across replicas.
        # Port 8082 is NOT published to the host — internal Docker network only.
        INTERNAL_API_URL: "http://traefik:8082"
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env.frontend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://'+require('os').hostname()+':3000/', (res) => { if (res.statusCode < 500) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.turborepo.env=production"
      - "com.turborepo.service=app"

  # Infrastructure helpers also kept for "simulation" as requested
  traefik:
    image: traefik:v3.1
    container_name: turborepo_saas_traefik_ngrok
    user: root
    command:
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:8081"
      # Disable read/write timeouts on the web entrypoint so that WebSocket
      # connections (Socket.IO) are not killed mid-session. The default
      # readTimeout is 60 s which would terminate idle WebSocket connections.
      # Setting to 0 disables the timeout (Traefik convention).
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=3600"
      - "--accesslog=true"
    ports:
      - "8081:8081"
      - "8080:8080" # Traefik dashboard
    volumes:
      - "./traefik_dynamic.yaml:/etc/traefik/dynamic.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      resources:
        limits:
          # 256M is generous headroom for Traefik (~36MB idle).
          # A limit prevents memory leaks from consuming the entire host RAM
          # under high concurrency or a runaway goroutine.
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  mailpit:
    image: axllent/mailpit:latest
    container_name: turborepo_saas_mailpit_ngrok
    environment:
      - MP_DATABASE=/data/mailpit.db
      - MP_MAX_MESSAGES=500
    volumes:
      - engecomp_crew_agents_mailpit_data_ngrok:/data
    ports:
      - "1025:1025"
      - "8026:8025"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  minio:
    image: minio/minio:latest
    container_name: turborepo_saas_minio_ngrok
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - engecomp_crew_agents_minio_data_ngrok:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: turborepo_saas_pgadmin_ngrok
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: turborepo_saas_redisinsight_ngrok
    ports:
      - "5540:5540"
    restart: unless-stopped
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

  ngrok:
    build:
      # context: . resolves to docker/ngrok/ (relative to this compose file).
      # Only the files in that directory are needed for the ngrok image.
      context: .
      dockerfile: Dockerfile.ngrok
    container_name: turborepo_saas_ngrok_ngrok
    restart: unless-stopped
    depends_on:
      - traefik
    # env_file path is relative to this compose file (docker/ngrok/).
    # env_file injects NGROK_AUTHTOKEN and NGROK_BASIC_AUTH directly into the
    # container. No `environment:` override here — doing so would attempt shell
    # variable substitution (${NGROK_AUTHTOKEN}) which defaults to blank when
    # the var is not exported in the host shell, silently overriding env_file.
    env_file:
      - .env.ngrok
    deploy:
      resources:
        limits:
          # 128M is generous headroom for ngrok agent (~39MB idle).
          # A limit prevents unbounded growth if many long-lived tunnels
          # are established simultaneously.
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 48M
    labels:
      com.turborepo.env: "production"
      com.turborepo.service: "infra"

volumes:
  engecomp_crew_agents_postgres_data_ngrok:
  engecomp_crew_agents_redis_data_ngrok:
  engecomp_crew_agents_rabbitmq_data_ngrok:
  engecomp_crew_agents_minio_data_ngrok:
  engecomp_crew_agents_mailpit_data_ngrok:

networks:
  default:
    external: true
    name: observability-net
